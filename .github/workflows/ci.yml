name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: us-east-1
  AWS_REGION: us-east-1

jobs:
  validate-build:
    name: Validate and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest

      - name: Validate SAM template
        run: sam validate --template-file template.yaml

      - name: Build SAM application
        run: sam build --template-file template.yaml --cached --parallel

      - name: Compile Python sources
        run: python -m compileall lambda
