version = 0.1

[default.global.parameters]
stack_name = "aws-resume-matcher"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-east-1"
s3_prefix = "aws-resume-matcher"
parameter_overrides = "ResumeBucket=\"jon-resume-matcher-dev\" ResumeKey=\"resume/resume.txt\" ApiPath=\"/match\" SemanticMatchingEnabled=\"true\" SemanticEmbeddingProvider=\"bedrock\" BedrockEmbeddingModelId=\"amazon.titan-embed-text-v2:0\" BedrockEmbeddingDimensions=\"512\" EmbeddingCacheBucket=\"\" EmbeddingCachePrefix=\"embeddings/resume\""
